<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>This is a paragraph</p>
    <p>This is another paragraph</p>

    <ol>
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ol>

    <button id="btn1">Add Text</button>
    <button id="btn2">Add List Items</button>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            // Append
            // $('#btn1').click(function(){
            //     $('p').append("<b> Append Text</b>");
            // });

            // $('#btn2').click(function(){
            //     $('ol').append("<li>Append Item</li>");
            // });
            
            // Prepend
            $('#btn1').click(function(){
                $('p').prepend("<b> Append Text </b>");
            });

            $('#btn2').click(function(){
                $('ol').prepend("<li>Append Item</li>");
            });

        });
    </script>
</body>
</html>
