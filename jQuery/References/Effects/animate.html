<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animate effect</title>
</head>

<body>
    <button id="resize">Animate Height</button>
    <button id="reset">Reset Height</button><br><br>
    <div style="height: 100px;border:2px solid;width:100px;background-color:rgb(0, 128, 157)"></div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#resize").click(function(){
                $("div").animate({height: "300px"});
            });
            $("#reset").click(function(){
                $("div").animate({height: "100px"});
            });
        })
    </script>
</body>

</html>
