<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children Class Method</title>
    <style>
        .descendants * {
            border: 2px solid lightgrey;
            color: lightgrey;
            display: block;
            margin: 10px;
            padding: 5px;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("div").children("p.p1").css({ "color": "red", "border": "1px solid red" });
        });
    </script>
</head>

<body>
    <div class="descendants"> div (current element)
        <p class="p1"> p (child)
            <span>span (grandchild)</span>
        </p>

        <p class="p2"> p (child)
            <span>span (grandchild)</span>
        </p>
    </div>
</body>

</html>
