<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traversing Parent Method</title>
    <style>
        .ancestors *{
            display: block;
            border: 2px solid lightgrey;
            color: lightgrey;
            padding: 5px;
            margin: 15px;

        }
    </style>
</head>
<body>
    <div class="ancestors">
        <div style="width: 500px;">div (great-grand parent)
            <ul>ul (grand parent)
                <li>(direct parent)
                    <span>span</span>
                </li>
            </ul>
        </div>
        <div style="width: 500px;"> div (grand parent)
            <p>p (direct parent)
                <span>span</span>
            </p>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $('span').parent().css({"color":"red", "border":"2px solid"});
        });
    </script>
</body>
</html>
