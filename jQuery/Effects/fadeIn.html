<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade In</title>
</head>
<body>
    <button>Fade In</button>
    <br><br>
    <div id="box1" style="width:80px;height:80px;display:none;background-color:red;"></div>
    <br>
    <div id="box2" style="width:80px;height:80px;display:none;background-color:green"></div>
    <br>
    <div id="box3" style="width:80px;height:80px;display:none;background-color:blue;"></div>

    <script src="../js/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){

            $('button').click(function(){
                $('#box1').fadeIn();
                $('#box2').fadeIn("slow");
                $('#box3').fadeIn(3000);
            });
        });
    </script>
    
</body>
</html>
