<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
    <style>
        #googleMap {
            border: 1px solid black;
            width: 100%;
            height: 400px;
        }
    </style>
</head>

<body onload="myMap()">
    <h2>Google Map</h2>

    <div id="googleMap"></div>

    <script>
        function myMap() {
            var mapProp = {
                center: new google.maps.LatLng(21.964506, 71.336368),
                zoom: 17,
            }
            var map = new google.maps.Map(document.getElementById("googleMap"), mapProp);

        }
    </script>

    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAlpb2Vtu6OKGptfMoVB-xeUtzIp9mq7rM"></script>
</body>

</html>
