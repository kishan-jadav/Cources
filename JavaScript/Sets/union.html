<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Union</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const kishan = new Set(["a","b","c"]);
        const vishal = new Set(["b","c","d"]);

        let naresh = kishan.union(vishal);

        let text = "";
        for(const x of naresh){
            text += x;
        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
