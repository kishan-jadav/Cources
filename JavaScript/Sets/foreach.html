<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>print all set items</title>
</head>
<body>
    <p id="demo"></p>


    <script>
        const letter = new Set(["a","b","c","d","e","f","g","h","i","j","k","l","m"]);

        let text = "";
        letter.forEach(function(value){
            text += value +"<br>";
        })

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
