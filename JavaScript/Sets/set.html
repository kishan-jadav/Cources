<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Method</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const letters = new Set(["a","b","c","d","a"]);     // set only unique value j store kare

        document.getElementById("demo").innerHTML = "The set has " + letters.size + " values.";
    </script>
</body>
</html>
