<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Method</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const letters = new Set(["a","b","c","d","a"]); 

        let text="";
        for(const x of letters){
            text += x;
        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
