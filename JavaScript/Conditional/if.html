<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If statement</title>
</head>
<body>
    
    <p id="demo"></p>

    <script>
        let age = 21;
        let country = "Dubai";
        let text = "You can't drive.";

        if(age >= 18 && country == "Dubai"){
            text = "You can drive !";
        }


        document.getElementById("demo").innerHTML= text;
    </script>
</body>
</html>
