<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Operator</title>
</head>
<body>
    
    <p id="demo"></p>

    <script>
        let age = 21;

        let result = (age < 18) ? "You can't vote !" : "You can vote.";

        document.getElementById("demo").innerHTML = result;
    </script>

</body>
</html>
