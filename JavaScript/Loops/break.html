<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Statement</title>
</head>
<body>
    
    <p id="demo"></p>

    <script>
        let text = "";

        for(let i = 1; i<=10; i++){
            if(i === 5){
                break;
            }

            text += i + "<br>";
        }

        document.getElementById("demo").innerHTML=text
    </script>

</body>
</html>
