<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let text = "";
        let i=19;

        do{
            text += i + "<br>";
            i++;
        }while(i <= 10)

        document.getElementById("demo").innerHTML= text;
    </script>
</body>
</html>
