<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue Statement</title>
</head>

<body>

    <p id="demo"></p>

    <script>
        let text = "";

        for (i = 1; i <= 10; i++) {
            if(i===5){continue;}    // 5 skipped....
            text += i + "<br>";
            
        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>

</html>
