<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Timeout</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        setTimeout(function(){
            document.getElementById("demo").innerHTML = "Hello";
        }, 3000)
    </script>

</body>
</html>
