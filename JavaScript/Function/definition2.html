<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const myFunction = function(x, y){
            return x * y;
        }

        let x = myFunction(3, 4);
        
        document.getElementById("demo").innerHTML = x;
    </script>
</body>
</html>
