<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>
<body>
    
    <p id="demo"></p>

    <script>
        const multiply = (a,b) => a * b;
        
        let result = multiply(10, 2);

        document.getElementById("demo").innerHTML = result;


    </script>

</body>
</html>
