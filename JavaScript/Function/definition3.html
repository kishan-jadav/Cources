<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Function() Constructor</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const myFunction = new Function("x", "y", "return x*y");        // Function() constructor ma F capital aave

        // or
        // const myFunction = function (a, b) {return a * b};


        document.getElementById("demo").innerHTML = myFunction(4,3);

    </script>
</body>
</html>
