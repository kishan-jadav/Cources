<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout()</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        setTimeout(myFunction, 3000);   // 3 sec na delay pachi function run thay

        function myFunction(){
            document.getElementById("demo").innerHTML = "Welcome !";
        }
    </script>
</body>
</html>
