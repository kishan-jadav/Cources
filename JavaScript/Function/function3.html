<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        function myFunction(x,y){
            return x * y;
        }

        result = myFunction(10,2);
        document.getElementById("demo").innerHTML = result;
    </script>
</body>
</html>
