<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>

<body>
    <button onclick="showHello()">Click Me</button>
    <p id="demo"></p>

    <script>

        function sayHello() {
            return "Hello World !"
        }

        function showHello(){
            document.getElementById("demo").innerHTML = sayHello();
        }
    </script>
</body>

</html>
