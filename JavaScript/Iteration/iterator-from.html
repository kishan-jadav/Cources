<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iterator from() method</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const myIterator = Iterator.from([1,2,3,4,5]);      // Iterator koi pn koi pn element ne looping kari shake

        let text = "";
        for(const x of myIterator){
            text+= x;
        }

        document.getElementById("demo").innerHTML= text;
    </script>
</body>
</html>
