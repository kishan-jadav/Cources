<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator</title>
</head>

<body>
    <p id="demo"></p>

    <script>
        // yield = pause, return = full stop
        // yield value ne pause karine rakhe, return value ne direct bahar send kari de

        function* myStream() {
            yield 1;
            yield 2;
            return 3;
        }

        let myGenerator = myStream();
        let text = "";

        for (const x of myGenerator) {        // for loop last element print nathi kartu, reason -> return(done=true) etle for loop andar nathi jatu and break thy jay che.
            text += x;
        }

        document.getElementById("demo").innerHTML = text;

    </script>
</body>

</html>
