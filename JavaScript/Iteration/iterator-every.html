<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>every() method</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const myIterator = Iterator.from("1234567890");

        let result = myIterator.every(x => x > 7);

        document.getElementById("demo").innerHTML = result; 
        
    </script>
</body>
</html>
