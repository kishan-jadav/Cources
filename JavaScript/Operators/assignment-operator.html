<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators</title>
</head>

<body>

    <p id="demo"></p>
    <p id="demo2"></p>

    <script>
        let x = 10;

        document.getElementById("demo").innerHTML = x;
        document.getElementById("demo2").innerHTML = x *= x;

    </script>
</body>

</html>
