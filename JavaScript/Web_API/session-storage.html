<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Storage</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        sessionStorage.setItem("name","Kishan Jadav");      // jya sudhi browser open hoy tya sudhi data save rahe.
        document.getElementById("demo").innerHTML = sessionStorage.getItem("name");
    </script>
</body>
</html>
