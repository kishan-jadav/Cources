<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Java Script to JSON</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const person = {
            name : "Kishan",
            age : 21,
            city : "sukhpur"
        }

        const text = JSON.stringify(person);

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
