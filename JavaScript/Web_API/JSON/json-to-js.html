<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert JSON to Java Script</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        // JSON Text
        const text = '{"name":"kishan", "age":"21", "city":"sukhpur"}';

        const person = JSON.parse(text);

        document.getElementById("demo").innerHTML = person.name + person.age + person.city;
    </script>
</body>
</html>
