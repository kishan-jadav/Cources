<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Storage</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        localStorage.setItem("name","Kishan Jadav");        // jya sudhi webpage open hoy tya sudhi data save rahe
        document.getElementById("demo").innerHTML = localStorage.getItem("name");
    </script>
</body>
</html>
