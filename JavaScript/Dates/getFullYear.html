<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Full Year</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const date = new Date().getFullYear();

        document.getElementById("demo").innerHTML = date;
    </script>
</body>
</html>
