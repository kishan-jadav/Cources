<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Loop</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const cars = ["Lamborghini", "BMW", "Ferrari", "Hummer H2", "Bugatti"];
        let text = cars.sort();

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
