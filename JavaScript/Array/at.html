<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>at Method</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let cars = ["Lamborghini", "BMW", "Ferrari", "Hummer H2", "Bugatti"];

        let x = cars.at(1);     // same as []
        // let x = cars[1];     
        document.getElementById("demo").innerHTML = x;
    </script>
</body>
</html>
