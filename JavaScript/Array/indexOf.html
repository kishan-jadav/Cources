<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Of</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const cars = ["Bugatti", "BMW", "Lamborghini", "Ferrari"];

        let position = cars.indexOf("Ferrari") + 1;

        document.getElementById("demo").innerHTML = position;
    </script>
</body>
</html>
