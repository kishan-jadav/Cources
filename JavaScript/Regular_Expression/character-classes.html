<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>character classes</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let text = "Hello GM";
        const pattern = /[HG]/g;        // matches all character between the bracket
        let n = text.match(pattern);

        document.getElementById("demo").innerHTML = n;
    </script>

</body>
</html>
