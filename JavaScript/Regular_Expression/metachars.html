<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>metachars</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let text = "Get 100%";
        let pattern = /\d/g;        // find digit
        let n = text.match(pattern);

        document.getElementById("demo").innerHTML = n;
    </script>
</body>
</html>
