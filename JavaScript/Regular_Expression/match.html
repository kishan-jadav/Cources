<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>match()</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let text = "This is Manali. Manali is the best place.";
        const myArr = text.match(/Manali/);     // match thay to first match ne print kare

        document.getElementById("demo").innerHTML = myArr;
    </script>
</body>
</html>
