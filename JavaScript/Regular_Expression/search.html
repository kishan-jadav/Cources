<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let text = "Welcome";   // start index from 0
        let n = text.search(/C/i);      // i = case insensitive

        document.getElementById("demo").innerHTML = n;
    </script>
</body>
</html>
