<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>

<body>
    <h2>To Do List</h2>

    <input id="task" type="text" placeholder="New Task">
    <button onclick="addTask()">Add</button><br><br>

    <ul id="list"></ul>
    <button onclick="clearTask()">Clear All</button>

    <script>
        let tasks = [];

        function displayTasks() {
            let html = "";

            for (let i = 0; i < tasks.length; i++) {
                html += "<li>" + tasks[i] + " <button onclick='removeTask(" + i + ")'>X</button></li>";
            }
            document.getElementById("list").innerHTML = html;
        }

        function addTask() {
            let taskInput = document.getElementById("task");
            let text = taskInput.value.trim(); // trim() blank spaces ko handle karta hai
            if (text === "") {
                return;
            }

            tasks.push(text);
            taskInput.value = "";
            saveTasks();
            displayTasks();
        }

        function removeTask(i) {
            tasks.splice(i, 1);
            saveTasks();
            displayTasks();
        }

        function clearTask() {
            tasks = [];
            saveTasks();
            displayTasks();
        }

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            let saved = localStorage.getItem("tasks");
            if (saved !== null) {
                tasks = JSON.parse(saved);
            }
        }

        loadTasks();
        displayTasks();

    </script>
</body>

</html>
