<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Create Object</title>
</head>
<body>
    
    <p id="demo"></p>

    <script>
        const car = {
            name: "Hummer H2",
            model: "SUV",
            color: "Black"
        };

        car.name = "Bugatti";

        document.getElementById("demo").innerHTML = car.name;
    </script>

</body>
</html>
