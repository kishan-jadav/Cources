<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Create Object</title>
</head>

<body>

    <p id="demo"></p>

    <script>
        const person = {
            name :"Kishan",
            surname :"Jadav",
            car: {
                name: "Hummer H2",
                model: "SUV",
                color: "Black"
            }
        };

        document.getElementById("demo").innerHTML = person.car.name;
    </script>

</body>

</html>
