<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toLocalString</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let num = 3241232.32;
        let local = num.toLocaleString();
        document.getElementById("demo").innerHTML = local;
    </script>
</body>
</html>
