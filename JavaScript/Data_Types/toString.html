<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toString</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let arr = ["Kishan","Vishal","Naresh"];
        let str = arr.toString();
        document.getElementById("demo").innerHTML = typeof(str);
    </script>
</body>
</html>
