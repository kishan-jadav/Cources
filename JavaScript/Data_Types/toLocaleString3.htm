<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>percent</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let per = 99;

        let result = per.toLocaleString("en-US", {style:"percent"});

        document.getElementById("demo").innerHTML = result;
    </script>
</body>
</html>
