<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let num = "10";
        let x = Number(num);

        document.getElementById("demo").innerHTML = typeof(x);
    </script>
</body>
</html>
