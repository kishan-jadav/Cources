<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Silent Errors</h1>

<p>Silent errors will not stop your program.</p>

<p id="demo"></p>

<script>
let result1 = ('5' + '2');
let result2 = ('5' - '2');

document.getElementById("demo").innerHTML = result1 + "<br>" + result2;
</script>

</body>
</html>
