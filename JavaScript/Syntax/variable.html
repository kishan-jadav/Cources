<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declare variable</title>
</head>

<body>

    <p id="demo"></p>

    <script>
        let person = "Kishan",
            car = "Hummer H2",
            price = 10000000;

        document.getElementById("demo").innerHTML = "Person name is " + person + " and his car name is " + car + " price is " + price;
    </script>
</body>

</html>
