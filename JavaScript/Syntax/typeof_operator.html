<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeof operator</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        a = "Kishan";
        b = 10;
        let c;

        document.getElementById("demo").innerHTML =
        typeof a + "<br>" +
        typeof b + "<br>" +
        typeof c;
    </script>
</body>
</html>
