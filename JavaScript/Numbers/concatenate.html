<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Concatenate</title>
</head>
<body>
    
    <p id="demo"></p>

    <script>
        let x = 12;
        let y = "12";
        document.getElementById("demo").innerHTML = x + y;
    </script>
</body>
</html>
