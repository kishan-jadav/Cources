<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>has</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const car = new Map([
            ["Bugatti", 5000],
            ["Lambo", 2100],
            ["Ferrari", 300]
        ]);

        let result = car.has("Lambo");        

        document.getElementById("demo").innerHTML = result;
    </script>
</body>
</html>
