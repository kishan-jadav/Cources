<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const name = new Map([
            ["kishan", 21],
            ["vishal", 20],
            ["naresh", 21],
            ["sahil", 21]
        ]);

        let text = "";
        for(const x of name.entries()){
            text += x + '<br>';
        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
