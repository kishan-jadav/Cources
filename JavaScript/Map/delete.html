<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delete</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        const cars = new Map([
            ["Bugatti", 500],
            ["Lamborghini", 300],
            ["Hummer H2", 100]
        ]);
        
        cars.delete("Bugatti");
        
        document.getElementById("demo").innerHTML = cars.size;
    </script>
</body>
</html>
