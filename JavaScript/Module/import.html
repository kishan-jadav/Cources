<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import</title>
</head>
<body>
    <p id="demo"></p>

    <script type="module">
        import {name, age} from "./module.js";

        let x = "My name is " + name + ", I am " + age + ".";
        document.getElementById("demo").innerHTML = x;
    </script>
</body>
</html>
